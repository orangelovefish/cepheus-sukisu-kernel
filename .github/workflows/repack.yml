# ============================================================
# 阶段 7: 全云端重打包 boot.img (jq 解析 / 严格自检)
#   - Release(stock-boot-base) 里的原版 boot.img.gz
#   - 指定 build run 的 Image.gz + System.map
#   - Magisk 官方 APK 内的 libmagiskboot.so
#   - 只替换 kernel(纯 Image.gz), 原样保留 kernel_dtb / ramdisk.cpio / header 字段
# ============================================================
name: cepheus-repack

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: '成功的 cepheus-sukisu run_id (纯数字)'
        required: true
      release_tag:
        description: '成品 Release tag'
        required: false
        default: 'sukisu-build-v2'
      stock_tag:
        description: '原版 boot.img.gz 所在 Release tag'
        required: false
        default: 'stock-boot-base'

permissions:
  contents: write
  actions: read

env:
  STOCK_TAG: ${{ github.event.inputs.stock_tag || 'stock-boot-base' }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'sukisu-build-v2' }}
  BUILD_RUN_ID: ${{ github.event.inputs.build_run_id }}
  EXPECTED_VERSION: 'Linux version 4.14.353-openela-REVUELTO-//aba8883167 (celeste@PixelOS-CI) (playground clang version 17.0.0 (https://github.com/llvm/llvm-project 4f4b2161ec3cc42890aa9a445588d5a9a67e9033), LLD 17.0.0) #1 SMP PREEMPT Sat Jan 18 01:37:43 CET 2025'

jobs:
  repack:
    name: repack-boot-sukisu
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: '0. 环境信息'
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          df -h /
          jq --version
          echo "build_run_id=$BUILD_RUN_ID stock=$STOCK_TAG release=$RELEASE_TAG"

      - name: '1. 下载原版 boot.img.gz 并解压'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          URL=$(curl -fsS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API/releases/tags/$STOCK_TAG" \
                | jq -r '.assets[] | select(.name == "boot.img.gz") | .browser_download_url' | head -1)
          echo "stock url: $URL"
          [ -n "$URL" ] && [ "$URL" != "null" ]
          curl -fSL --retry 3 -o work/boot.img.gz "$URL"
          ls -l work/boot.img.gz
          gzip -dc work/boot.img.gz > work/boot.img
          ls -l work/boot.img
          sha256sum work/boot.img | tee work/boot_stock.sha256

      - name: '2. 下载 SukiSU 编译产物 (Image.gz + System.map)'
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          ART=$(curl -fsS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
                "$API/actions/runs/$BUILD_RUN_ID/artifacts")
          echo "$ART" | jq -r '.artifacts[] | "\(.name)  \(.size_in_bytes)B  expired=\(.expired)"'
          URL=$(echo "$ART" | jq -r '.artifacts[0].archive_download_url')
          echo "artifact url: $URL"
          [ -n "$URL" ] && [ "$URL" != "null" ]
          curl -fSL --retry 3 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o work/art.zip "$URL"
          unzip -o work/art.zip -d work/art >/dev/null
          find work/art -type f | sort
          IMG=$(find work/art -name Image.gz | head -1)
          [ -n "$IMG" ] || { echo "FAIL: artifact 里没找到 Image.gz"; exit 1; }
          cp "$IMG" work/Image.gz
          SM=$(find work/art -name System.map | head -1)
          [ -n "$SM" ] || { echo "FAIL: artifact 里没找到 System.map"; exit 1; }
          cp "$SM" work/System.map
          ls -l work/Image.gz work/System.map
          echo "--- Image.gz 头 16 字节 ---"
          od -A x -t x1z -N 16 work/Image.gz

      - name: '2.5 校验 System.map 关键符号 (含安全模式/init 注入)'
        shell: bash
        run: |
          set -euo pipefail
          test -f work/System.map
          for s in ksu_handle_sys_reboot ksu_handle_execveat ksu_handle_execveat_sucompat ksu_handle_faccessat ksu_handle_stat ksu_handle_vfs_read ksu_handle_input_handle_event; do
            line=$(grep -E " $s\$" work/System.map | head -1 || true)
            if [ -n "$line" ]; then echo "OK   $s  ->  $line"; else echo "FAIL 缺少符号 $s"; exit 1; fi
          done
          echo "ksu 符号总数: $(grep -c ksu work/System.map)"

      - name: '3. 获取 magiskboot (Magisk 官方 APK 内)'
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/topjohnwu/Magisk"
          APK=$(curl -fsS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API/releases/latest" \
                | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -1)
          echo "magisk apk: $APK"
          [ -n "$APK" ] && [ "$APK" != "null" ]
          curl -fSL --retry 3 -o work/magisk.apk "$APK"
          unzip -o -j work/magisk.apk 'lib/x86_64/libmagiskboot.so' -d work/bin >/dev/null
          mv work/bin/libmagiskboot.so work/bin/magiskboot
          chmod +x work/bin/magiskboot
          ls -l work/bin/magiskboot
          work/bin/magiskboot 2>&1 | head -3 || true

      - name: '4. 解包原版 boot.img'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/orig && cd work/orig
          cp ../boot.img .
          ../bin/magiskboot unpack -h boot.img 2>&1 | tee unpack.txt
          echo "--- 解包产物 ---"
          ls -l
          sha256sum header ramdisk.cpio kernel kernel_dtb | tee hashes_orig.txt
          grep -E 'HEADER_VER|KERNEL_SZ|KERNEL_FMT|RAMDISK_SZ|RAMDISK_FMT|KERNEL_DTB_SZ|PAGESIZE|OS_VERSION|OS_PATCH_LEVEL|CMDLINE' unpack.txt | tee bootinfo_orig.txt

      - name: '5. 替换内核 (纯 Image.gz) 并 repack'
        shell: bash
        run: |
          set -euo pipefail
          cd work/orig
          cp ../Image.gz kernel
          echo "--- 替核后各文件 ---"
          ls -l kernel kernel_dtb ramdisk.cpio header
          od -A x -t x1z -N 16 kernel
          ../bin/magiskboot repack boot.img ../boot_sukisu.img 2>&1 | tee repack.txt
          cd ..
          ls -l boot_sukisu.img
          sha256sum boot_sukisu.img | tee boot_sukisu.sha256

      - name: '6. 回环自检 (字段/ramdisk/单dtb/指纹/体积)'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/verify && cd work/verify
          cp ../boot_sukisu.img .
          ../bin/magiskboot unpack -h boot_sukisu.img 2>&1 | tee unpack_new.txt
          ls -l
          echo "########## 1) 解析字段对比 ##########"
          for k in HEADER_VER PAGESIZE CMDLINE OS_VERSION OS_PATCH_LEVEL KERNEL_DTB_SZ RAMDISK_FMT; do
            A=$(grep -E "^$k" ../orig/unpack.txt | head -1 || true)
            B=$(grep -E "^$k" unpack_new.txt | head -1 || true)
            if [ "$A" = "$B" ]; then echo "OK   $k => $B"; else echo "FAIL $k 不一致"; echo "  旧: $A"; echo "  新: $B"; exit 1; fi
          done
          echo "########## 2) kernel_dtb 只有一份且 SHA256 一致 ##########"
          OLD_DTB=$(awk '/kernel_dtb/{print $1}' ../orig/hashes_orig.txt)
          NEW_DTB=$(sha256sum kernel_dtb | awk '{print $1}')
          echo "old=$OLD_DTB new=$NEW_DTB"
          [ "$OLD_DTB" = "$NEW_DTB" ] && echo "OK kernel_dtb 一致" || { echo "FAIL kernel_dtb 不一致"; exit 1; }
          echo "########## 3) ramdisk.cpio 内容 SHA256 一致 ##########"
          OLD_RD=$(awk '/ramdisk.cpio/{print $1}' ../orig/hashes_orig.txt)
          NEW_RD=$(sha256sum ramdisk.cpio | awk '{print $1}')
          echo "old=$OLD_RD new=$NEW_RD"
          [ "$OLD_RD" = "$NEW_RD" ] && echo "OK ramdisk 一致" || { echo "FAIL ramdisk 不一致"; exit 1; }
          echo "########## 4) header 原始字节对比 (仅供参考) ##########"
          if cmp -s ../orig/header header; then echo "OK header 原始字节完全一致"; else echo "INFO header 原始字节有差异(解析字段已逐一校验一致)"; fi
          echo "########## 5) 内核指纹硬断言 ##########"
          FMT=$(grep -E '^KERNEL_FMT' unpack_new.txt | head -1 || true)
          echo "解包内核格式: $FMT"
          if head -c 2 kernel | od -An -c | grep -q '037 213'; then
            echo "kernel 仍是 gzip, 先解压"
            gunzip -c kernel > kernel.raw
          else
            cp kernel kernel.raw
          fi
          ls -l kernel.raw
          V=$(strings kernel.raw | grep -m1 'Linux version 4.14\.353' || true)
          echo "实际: $V"
          echo "期望: $EXPECTED_VERSION"
          if [ "$V" = "$EXPECTED_VERSION" ]; then echo "OK 指纹逐字节一致"; else echo "FAIL 指纹不一致"; exit 1; fi
          case "$V" in
            *dirty*|*runnervm*|*SukiSU*) echo "FAIL 含可疑字样"; exit 1;;
            *) echo "OK 无 dirty/runnervm/SukiSU 字样";;
          esac
          case "$V" in *+*) echo "WARN 含加号(注意非 -dirty 的 +)";; esac
          echo "########## 6) 体积 <= 128MB ##########"
          SZ=$(stat -c%s boot_sukisu.img)
          echo "size=$SZ bytes"
          [ "$SZ" -le 134217728 ] && echo "OK 体积合规" || { echo "FAIL 超过 128MB"; exit 1; }
          cd ..
          sha256sum boot_sukisu.img > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: '7. 上传 Artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-sukisu-${{ github.run_number }}
          path: |
            work/boot_sukisu.img
            work/SHA256SUMS.txt
            work/verify/unpack_new.txt
            work/orig/unpack.txt
            work/verify/kernel.raw
            work/System.map
          if-no-files-found: warn
          retention-days: 14

      - name: '8. 上传到 GitHub Release'
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          RID=$(curl -fsS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API/releases/tags/$RELEASE_TAG" \
                | jq -r '.id // empty' || true)
          if [ -z "$RID" ]; then
            echo "release 不存在, 创建 $RELEASE_TAG"
            RID=$(curl -fsS -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"cepheus SukiSU kernel (boot.img)\",\"body\":\"SukiSU-Nova builtin + manual hook, stealth uname, built from run $BUILD_RUN_ID\"}" \
                  "$API/releases" | jq -r '.id')
          fi
          echo "release id: $RID"
          [ -n "$RID" ]
          for f in work/boot_sukisu.img work/SHA256SUMS.txt; do
            echo "uploading $f"
            curl -fsS -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" --data-binary @"$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$(basename "$f")" \
              | jq -r '"uploaded: \(.name) \(.size)B"'
          done

      - name: '9. 摘要'
        if: always()
        shell: bash
        run: |
          {
            echo "## cepheus repack"
            echo ""
            echo "- build run: \`$BUILD_RUN_ID\`"
            echo "- 结果: \`${{ job.status }}\`"
            echo "- 成品: boot_sukisu.img -> Artifacts + Release \`$RELEASE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
