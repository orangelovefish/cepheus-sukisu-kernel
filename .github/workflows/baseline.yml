# ============================================================
# 小米9 (cepheus) / PixelOS 15 / Linux 4.14.353-openela
# 纯净基线编译 (Baseline Build, 无任何补丁)
# 仓库源: balgxmr/kernel_xiaomi_cepheus @ fifteen (锁定 aba8883167)
# 用法: 放到你 fork 的仓库 .github/workflows/baseline.yml
#       -> Actions 页 -> cepheus-baseline -> Run workflow
# ============================================================
name: cepheus-baseline

on:
  workflow_dispatch:
    inputs:
      commit:
        description: '内核提交 SHA (默认与 PixelOS 15 刷机包内核完全一致)'
        required: false
        default: 'aba888316798ecdae3df9d38e8f9f5b7657022b3'
      toolchain:
        description: '工具链选择'
        required: false
        type: choice
        default: 'aosp-first'
        options:
          - aosp-first
          - llvm-only
      jobs:
        description: '并行线程数 (留空 = nproc)'
        required: false
        default: ''
      extra_kcflags:
        description: '额外 KCFLAGS (如 -Wno-error; 留空 = 官方原始参数)'
        required: false
        default: ''

permissions:
  contents: read

env:
  KERNEL_REPO: 'https://github.com/balgxmr/kernel_xiaomi_cepheus.git'
  KERNEL_COMMIT: ${{ github.event.inputs.commit || 'aba888316798ecdae3df9d38e8f9f5b7657022b3' }}
  INPUT_TC: ${{ github.event.inputs.toolchain || 'aosp-first' }}
  DEFCONFIG: 'cepheus_defconfig'
  AOSP_CLANG_URL: 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz'
  LLVM_TARBALL: 'https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz'

jobs:
  baseline:
    name: baseline-4.14.353-openela
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: 0. 机器信息
        shell: bash
        run: |
          uname -a
          echo "cores=$(nproc)"
          free -h
          df -h /

      - name: 1. 释放磁盘空间
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: 2. 安装编译依赖
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git libelf-dev libssl-dev \
            lz4 lzop python3 rsync xz-utils zip unzip zstd device-tree-compiler
          echo "--- 依赖版本 ---"
          for t in make bc bison flex python3 tar xz zstd cpio dtc; do
            printf '%-8s ' "$t"; command -v "$t" || echo MISSING
          done

      - name: 3. 还原工具链缓存
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains
          key: cepheus-clang-r530567-llvm17-v1

      - name: 4. 准备工具链 (AOSP clang-r530567 优先, LLVM 17.0.6 兜底)
        shell: bash
        run: |
          set -uo pipefail
          TC_AOSP="$HOME/toolchains/aosp"
          TC_LLVM="$HOME/toolchains/llvm"
          mkdir -p "$HOME/toolchains"

          if [ "$INPUT_TC" != "llvm-only" ] && [ ! -x "$TC_AOSP/bin/clang" ]; then
            echo "::group::下载 AOSP clang-r530567 (官方同款工具链)"
            if curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 \
                 -o "$RUNNER_TEMP/clang.tar.gz" "$AOSP_CLANG_URL"; then
              mkdir -p "$TC_AOSP"
              tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C "$TC_AOSP"
              echo "AOSP 工具链解压完成"
            else
              echo "::warning::AOSP 工具链下载失败, 转兜底方案"
            fi
            echo "::endgroup::"
          fi

          if [ -x "$TC_AOSP/bin/clang" ]; then
            TC="$TC_AOSP"
            echo "TOOLCHAIN_KIND=aosp-clang-r530567" >> "$GITHUB_ENV"
            echo "使用工具链: AOSP clang-r530567"
          else
            if [ ! -x "$TC_LLVM/bin/clang" ]; then
              echo "::group::下载 LLVM 17.0.6 官方版 (兜底)"
              curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 \
                -o "$RUNNER_TEMP/llvm.tar.xz" "$LLVM_TARBALL"
              mkdir -p "$TC_LLVM"
              tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$TC_LLVM" --strip-components=1
              echo "::endgroup::"
            fi
            TC="$TC_LLVM"
            echo "TOOLCHAIN_KIND=llvm-17.0.6-upstream" >> "$GITHUB_ENV"
            echo "::warning::AOSP 工具链不可用, 使用兜底 LLVM 17.0.6"
          fi

          echo "TC_DIR=$TC" >> "$GITHUB_ENV"
          echo "--- clang --version ---"
          "$TC/bin/clang" --version
          echo "--- ld.lld --version ---"
          "$TC/bin/ld.lld" --version || true
          echo "--- 关键工具存在性 ---"
          for b in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            printf '%-16s ' "$b"; command -v "$TC/bin/$b" || echo MISSING
          done

      - name: 5. 精准拉取内核源码 (git init + fetch --depth 1 + checkout FETCH_HEAD)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel && cd kernel
          git init -q
          git remote add origin "$KERNEL_REPO"
          git fetch --depth 1 origin "$KERNEL_COMMIT"
          git checkout -q FETCH_HEAD
          echo "HEAD = $(git rev-parse HEAD)"
          git log -1 --pretty='%H%n%ad%n%s' --date=iso
          echo "--- Makefile 版本 ---"
          head -6 Makefile
          echo "--- defconfig 存在性 ---"
          ls -l arch/arm64/configs/cepheus_defconfig
          grep -E 'CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=|CONFIG_BUILD_ARM64_DT_OVERLAY=' \
            arch/arm64/configs/cepheus_defconfig

      - name: '6. 编译 (官方同参数 LLVM=1 LLVM_IAS=1)'
        shell: bash
        run: |
          set -o pipefail
          cd kernel
          export PATH="$TC_DIR/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          JOBS_RAW="${{ github.event.inputs.jobs }}"
          if [ -n "$JOBS_RAW" ]; then JOBS="$JOBS_RAW"; else JOBS="$(nproc)"; fi
          EXTRA="${{ github.event.inputs.extra_kcflags }}"
          echo "clang   : $(command -v clang)"
          echo "commit  : $KERNEL_COMMIT"
          echo "jobs    : $JOBS"
          echo "kcflags : ${EXTRA:-(empty)}"
          echo
          echo "===== 步骤 6.1: 生成 .config ====="
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 "$DEFCONFIG" 2>&1 | tee ../config.log
          echo "===== 步骤 6.2: 全量编译 ====="
          if [ -n "$EXTRA" ]; then
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$JOBS" KCFLAGS="$EXTRA" 2>&1 | tee ../build.log
          else
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$JOBS" 2>&1 | tee ../build.log
          fi
          echo "===== 编译命令正常返回 ====="

      - name: 7. 产物检查 (清单 / 前 32 字节 / 内核版本串)
        if: always()
        shell: bash
        run: |
          BOOT=kernel/out/arch/arm64/boot
          echo "########## $BOOT 目录 ##########"
          ls -lh "$BOOT" 2>/dev/null || echo "(目录不存在, 编译可能失败)"
          echo
          echo "########## 各镜像头 32 字节 ##########"
          for f in "$BOOT/Image" "$BOOT/Image-dtb" "$BOOT/Image.gz" "$BOOT/Image.gz-dtb" "$BOOT/dtbo.img"; do
            [ -f "$f" ] || continue
            echo "--- $(basename "$f") | $(stat -c%s "$f") bytes ---"
            od -A x -t x1z -N 32 "$f"
            if head -c 16 "$f" | grep -qa 'UNCOMPRESSED_IMG'; then
              echo ">>> 该产物带 UNCOMPRESSED_IMG 头 <<<"
            fi
            echo
          done
          echo "########## dts 子目录产物 ##########"
          ls -lh "$BOOT/dts/qcom/" 2>/dev/null | head -15 || true
          echo
          echo "########## 内嵌内核版本串 ##########"
          strings "$BOOT/Image" 2>/dev/null | grep -m2 'Linux version' || echo '(未找到)'
          echo
          echo "########## System.map / .config ##########"
          ls -lh kernel/out/System.map kernel/out/.config 2>/dev/null || true

      - name: 8. 失败时提取关键报错
        if: failure()
        shell: bash
        run: |
          echo "########## 报错行 (error:) ##########"
          grep -n -E 'error:|fatal error|Error [0-9]|\*\*\* ' build.log 2>/dev/null | tail -100 || true
          echo
          echo "########## build.log 末尾 120 行 ##########"
          tail -120 build.log 2>/dev/null || true
          echo
          echo "########## config.log 末尾 40 行 ##########"
          tail -40 config.log 2>/dev/null || true

      - name: 9. 上传产物与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-baseline-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/System.map
            kernel/out/.config
            build.log
            config.log
          if-no-files-found: warn
          retention-days: 14

      - name: 10. 运行摘要
        if: always()
        shell: bash
        run: |
          {
            echo "## cepheus 基线编译"
            echo ""
            echo "- 提交: \`$KERNEL_COMMIT\`"
            echo "- 工具链: \`${TOOLCHAIN_KIND:-unknown}\`"
            echo "- 结果: \`${{ job.status }}\`"
            echo "- 产物: Image.gz-dtb / dtbo.img / System.map (见 Artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"
