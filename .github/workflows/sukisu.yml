# ============================================================
# cepheus (SM8150) / PixelOS 15 / Linux 4.14.353-openela
# SukiSU-Nova (builtin 分支, 纯 Manual Hook) 编译
#   - 不集成 SUSFS / 不开 KPM / 不篡改 syscall table / KALLSYMS 保持关闭
#   - uname 指纹伪装为原版 PixelOS 内核
# ============================================================
name: cepheus-sukisu

on:
  workflow_dispatch:
    inputs:
      commit:
        description: '内核提交 SHA'
        required: false
        default: 'aba888316798ecdae3df9d38e8f9f5b7657022b3'
      suki_ref:
        description: 'SukiSU-Nova 分支(builtin/其他)'
        required: false
        default: '4bec532dd447e2852aa8932afa768255350c103a'
      extra_kcflags:
        description: '额外 KCFLAGS (留空 = 无)'
        required: false
        default: ''

permissions:
  contents: read

env:
  KERNEL_REPO: 'https://github.com/balgxmr/kernel_xiaomi_cepheus.git'
  KERNEL_COMMIT: ${{ github.event.inputs.commit || 'aba888316798ecdae3df9d38e8f9f5b7657022b3' }}
  SUKI_REPO: 'https://github.com/SukiSU-Nova/SukiSU-Nova.git'
  SUKI_REF: ${{ github.event.inputs.suki_ref || 'builtin' }}
  DEFCONFIG: 'cepheus_defconfig'
  AOSP_CLANG_URL: 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz'
  LLVM_TARBALL: 'https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz'
  KBUILD_BUILD_USER: 'celeste'
  KBUILD_BUILD_HOST: 'PixelOS-CI'
  KBUILD_BUILD_TIMESTAMP: 'Sat Jan 18 01:37:43 CET 2025'
  KBUILD_BUILD_COMPILER_STRING: 'playground clang version 17.0.0 (https://github.com/llvm/llvm-project 4f4b2161ec3cc42890aa9a445588d5a9a67e9033)'
  KBUILD_BUILD_LD_STRING: 'LLD 17.0.0'
  HIDE_LOCALVERSION: '//aba8883167'

jobs:
  build:
    name: sukisu-4.14.353-openela
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: '0. 检出本仓库 (获取 patches/)'
        uses: actions/checkout@v4

      - name: '1. 机器信息与补丁清单'
        shell: bash
        run: |
          uname -a
          echo "cores=$(nproc)"
          free -h
          df -h /
          ls -l patches/

      - name: '2. 释放磁盘空间'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: '3. 安装编译依赖'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git libelf-dev libssl-dev \
            lz4 lzop python3 rsync xz-utils zip unzip zstd device-tree-compiler

      - name: '4. 还原工具链缓存'
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains
          key: cepheus-clang-r530567-llvm17-v1

      - name: '5. 准备工具链'
        shell: bash
        run: |
          set -uo pipefail
          TC_AOSP="$HOME/toolchains/aosp"
          TC_LLVM="$HOME/toolchains/llvm"
          mkdir -p "$HOME/toolchains"
          if [ ! -x "$TC_AOSP/bin/clang" ]; then
            echo "::group::下载 AOSP clang-r530567"
            if curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 \
                 -o "$RUNNER_TEMP/clang.tar.gz" "$AOSP_CLANG_URL"; then
              mkdir -p "$TC_AOSP"
              tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C "$TC_AOSP"
            else
              echo "::warning::AOSP 工具链下载失败"
            fi
            echo "::endgroup::"
          fi
          if [ -x "$TC_AOSP/bin/clang" ]; then
            TC="$TC_AOSP"
          else
            if [ ! -x "$TC_LLVM/bin/clang" ]; then
              curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 \
                -o "$RUNNER_TEMP/llvm.tar.xz" "$LLVM_TARBALL"
              mkdir -p "$TC_LLVM"
              tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$TC_LLVM" --strip-components=1
            fi
            TC="$TC_LLVM"
            echo "::warning::使用兜底 LLVM 17.0.6"
          fi
          echo "TC_DIR=$TC" >> "$GITHUB_ENV"
          "$TC/bin/clang" --version

      - name: '6. 拉取内核源码 (指定提交, 浅取)'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel && cd kernel
          git init -q
          git remote add origin "$KERNEL_REPO"
          git fetch --depth 1 origin "$KERNEL_COMMIT"
          git checkout -q FETCH_HEAD
          git config user.email "ci@cepheus.local"
          git config user.name "cepheus-ci"
          echo "HEAD=$(git rev-parse HEAD)"
          head -5 Makefile
          ls -l arch/arm64/configs/cepheus_defconfig

      - name: '7. 克隆 SukiSU-Nova 并挂载到 drivers/kernelsu'
        shell: bash
        run: |
          set -euo pipefail
          git clone "$SUKI_REPO" KernelSU
          git -C KernelSU checkout -q "$SUKI_REF"
          ( cd KernelSU && echo "SUKI_HEAD=$(git rev-parse HEAD)" && git log -1 --pretty='%ad %s' --date=iso )
          ln -sfn "$PWD/KernelSU/kernel" kernel/drivers/kernelsu
          grep -q 'kernelsu' kernel/drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> kernel/drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' kernel/drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' kernel/drivers/Kconfig
          echo "--- drivers/Makefile 尾部 ---"
          tail -3 kernel/drivers/Makefile
          echo "--- drivers/Kconfig 尾部 ---"
          tail -4 kernel/drivers/Kconfig
          echo "--- kernelsu 挂载点 ---"
          ls -l kernel/drivers/kernelsu | head -8
          echo "--- KSU Kconfig 前 12 行 ---"
          head -12 kernel/drivers/kernelsu/Kconfig

      - name: '8. 应用补丁 (先 apply --check)'
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          echo "=== git apply --check 001 ==="
          git apply --check -v ../patches/001-ksu-hooks-4.14.patch
          echo "=== git apply --check 002 ==="
          git apply --check -v ../patches/002-stealth-uts.patch
          echo "=== 开始应用 ==="
          git apply ../patches/001-ksu-hooks-4.14.patch
          git apply ../patches/002-stealth-uts.patch
          echo "=== 改动统计 ==="
          git diff --stat
          echo "=== SukiSU 侧 4.14 兼容补丁 ==="
          for p in "$GITHUB_WORKSPACE"/patches/003-*.patch; do
            [ -f "$p" ] || continue
            echo "--- $(basename "$p") ---"
            git -C "$GITHUB_WORKSPACE/KernelSU" apply --check -v "$p"
            git -C "$GITHUB_WORKSPACE/KernelSU" apply "$p"
          done
          git -C "$GITHUB_WORKSPACE/KernelSU" diff --stat || true
          echo "=== 写入 .scmversion 锁死 localversion ==="
          printf '%s' "$HIDE_LOCALVERSION" > .scmversion
          printf '  .scmversion = '
          cat .scmversion
          printf '\n'
          echo "=== hook 落点抽查 ==="
          grep -n 'ksu_handle_' fs/exec.c fs/open.c fs/stat.c fs/read_write.c drivers/input/input.c kernel/reboot.c
          echo "=== mkcompile_h 改动抽查 ==="
          grep -n 'KBUILD_BUILD_COMPILER_STRING' scripts/mkcompile_h

      - name: '9. 配置 defconfig 并打印 KSU 生效项'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TC_DIR/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          cd kernel
          printf '\n' >> arch/arm64/configs/cepheus_defconfig
          printf '# --- SukiSU (builtin / manual hook, non-GKI 4.14) ---\n' >> arch/arm64/configs/cepheus_defconfig
          printf 'CONFIG_KSU=y\n' >> arch/arm64/configs/cepheus_defconfig
          printf '# CONFIG_KSU_SUSFS is not set\n' >> arch/arm64/configs/cepheus_defconfig
          printf '# CONFIG_KPM is not set\n' >> arch/arm64/configs/cepheus_defconfig
          printf '# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set\n' >> arch/arm64/configs/cepheus_defconfig
          echo "--- defconfig 尾部 ---"
          tail -6 arch/arm64/configs/cepheus_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 "$DEFCONFIG" 2>&1 | tee ../config.log
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig 2>&1 | tee -a ../config.log
          echo "=========== KSU / KALLSYMS / SELINUX 生效项 ==========="
          grep -E '^CONFIG_(KSU|KPM|KALLSYMS|SECURITY|SECURITY_SELINUX)' out/.config | sort
          echo "=========== 关键项判定 ==========="
          for k in CONFIG_KSU CONFIG_KPM CONFIG_KALLSYMS CONFIG_KSU_SUSFS; do
            if grep -q "^$k=y" out/.config; then echo "$k = y"; else echo "$k = n"; fi
          done

      - name: '9.5 极速预检 (快速暴露 4.14 兼容性问题)'
        shell: bash
        run: |
          set -o pipefail
          cd kernel
          export PATH="$TC_DIR/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          echo "===== 预检 1/2: scripts prepare ====="
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 scripts prepare 2>&1 | tee ../precheck.log | tail -20
          echo "===== 预检 1.5/2: 生成 include/generated/compile.h 并核对指纹 ====="
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 include/generated/compile.h 2>&1 | tee -a ../precheck.log | tail -5
          echo "--- out/include/generated/compile.h ---"
          cat out/include/generated/compile.h || true

          echo "===== 预检 2/2: 单编 kernelsu + 6 个 hook 目标文件 (-k) ====="
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -k -j"$(nproc)" \
            drivers/kernelsu/ \
            fs/exec.o fs/open.o fs/stat.o fs/read_write.o \
            drivers/input/input.o kernel/reboot.o 2>&1 | tee -a ../precheck.log | tail -60
          echo "===== 预检通过, 继续全量编译 ====="
          echo "--- error 行汇总 ---"
          grep -n -E 'error:|fatal error' ../precheck.log | tail -40 || echo '(无 error)'
          echo "--- KSU 版本信息 ---"
          grep -m5 -E 'version: |KERNEL_TYPE|KERNEL_VERSION' ../precheck.log || true

      - name: '10. 编译 (含 SukiSU)'
        shell: bash
        run: |
          set -o pipefail
          cd kernel
          export PATH="$TC_DIR/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          EXTRA="${{ github.event.inputs.extra_kcflags }}"
          echo "clang   : $(command -v clang)"
          echo "buildby : $KBUILD_BUILD_USER@$KBUILD_BUILD_HOST"
          echo "stamp   : $KBUILD_BUILD_TIMESTAMP"
          if [ -n "$EXTRA" ]; then
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$(nproc)" KCFLAGS="$EXTRA" 2>&1 | tee ../build.log
          else
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$(nproc)" 2>&1 | tee ../build.log
          fi
          echo "===== 编译命令正常返回 ====="

      - name: '11. 验收检查 (指纹 / KSU 目标文件 / 镜像头)'
        if: always()
        shell: bash
        run: |
          BOOT=kernel/out/arch/arm64/boot
          echo "########## 产物目录 ##########"
          ls -lh "$BOOT" 2>/dev/null || echo "(无产物)"
          echo
          echo "########## kernelsu 目标文件 ##########"
          ls -l kernel/out/drivers/kernelsu/ 2>/dev/null | head -15 || echo "(未找到 out/drivers/kernelsu)"
          echo
          echo "########## System.map 里的 ksu 符号数 ##########"
          grep -c 'ksu' kernel/out/System.map 2>/dev/null || echo 0
          grep -m5 'ksu_handle' kernel/out/System.map 2>/dev/null || true
          echo
          echo "########## 内核指纹 (关键验收) ##########"
          V=$(strings "$BOOT/Image" 2>/dev/null | grep -m1 'Linux version')
          echo "$V"
          echo "--- 期望 ---"
          echo "Linux version 4.14.353-openela-REVUELTO-//aba8883167 (celeste@PixelOS-CI) (playground clang version 17.0.0 (https://github.com/llvm/llvm-project 4f4b2161ec3cc42890aa9a445588d5a9a67e9033), LLD 17.0.0) #1 SMP PREEMPT Sat Jan 18 01:37:43 CET 2025"
          echo "--- 自检 ---"
          case "$V" in
            *SukiSU*) echo "WARN: 含 SukiSU";;
          esac
          case "$V" in
            *dirty*) echo "WARN: 含 dirty";;
          esac
          case "$V" in
            *runner@*) echo "WARN: 含 runner@";;
          esac
          case "$V" in
            *celeste@PixelOS-CI*) echo "OK: 构建者已伪装为 celeste@PixelOS-CI";;
          esac
          echo
          echo "########## 镜像头 32 字节 ##########"
          for f in "$BOOT/Image" "$BOOT/Image.gz-dtb" "$BOOT/dtbo.img"; do
            [ -f "$f" ] || continue
            echo "--- $(basename "$f")"
            od -A x -t x1z -N 32 "$f"
          done
          echo
          echo "########## out/.config 中的 KSU 相关 ##########"
          grep -E '^CONFIG_(KSU|KPM|KALLSYMS)' kernel/out/.config | sort

      - name: '12. 失败时提取关键报错'
        if: failure()
        shell: bash
        run: |
          echo "########## error 行 ##########"
          grep -n -E 'error:|fatal error|Error [0-9]|\*\*\* ' build.log 2>/dev/null | tail -120 || true
          echo "########## build.log 末尾 140 行 ##########"
          tail -140 build.log 2>/dev/null || true

      - name: '13. 上传产物与日志'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-sukisu-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/System.map
            kernel/out/.config
            build.log
            config.log
            precheck.log
          if-no-files-found: warn
          retention-days: 14

      - name: '14. 运行摘要'
        if: always()
        shell: bash
        run: |
          {
            echo "## cepheus SukiSU 编译"
            echo ""
            echo "- 内核提交: \`$KERNEL_COMMIT\`"
            echo "- SukiSU: \`$SUKI_REF\`"
            echo "- 结果: \`${{ job.status }}\`"
            echo "- SUSFS/KPM/KALLSYMS/tamper_syscall_table: 全部关闭"
          } >> "$GITHUB_STEP_SUMMARY"
